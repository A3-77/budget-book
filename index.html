<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<meta name="description" content="预算本 —— 写下每天的预算，自动算出这个月要花多少">
<title>预算本 · 先定预算，再记每天</title>

<!-- 加到手机桌面用 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="预算本">
<meta name="format-detection" content="telephone=no">
<style>
/* ============ 主题变量 ============ */
:root{
  --bg:#f4f5fa;
  --surface:#ffffff;
  --surface-2:#eef0f7;
  --text:#111420;
  --text-2:#697086;
  --text-3:#9aa1b3;
  --line:#e7e9f2;
  --brand:#5b5bd6;
  --brand-2:#8b7cf6;
  --brand-ink:#5b5bd6;
  --mint:#10b981;
  --amber:#f59e0b;
  --rose:#f43f5e;
  --shadow:0 1px 2px rgba(17,20,32,.04), 0 10px 30px -14px rgba(17,20,32,.18);
  --seg-on:#ffffff;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0c12;
  --surface:#141824;
  --surface-2:#1c2130;
  --text:#eef1f8;
  --text-2:#98a0b5;
  --text-3:#6d768c;
  --line:#252c3d;
  --brand-ink:#b3a8ff;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -16px rgba(0,0,0,.8);
  --seg-on:#2c3448;
}
html{color-scheme:light;-webkit-text-size-adjust:100%}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 420px at 8% -8%, rgba(124,108,246,.20), transparent 62%),
    radial-gradient(560px 420px at 98% -2%, rgba(16,185,129,.14), transparent 60%);
}
html[data-theme="dark"] body::before{
  background:
    radial-gradient(620px 420px at 8% -8%, rgba(124,108,246,.16), transparent 62%),
    radial-gradient(560px 420px at 98% -2%, rgba(16,185,129,.10), transparent 60%);
}

.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:22px 18px 130px}

/* ============ 顶部 ============ */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand-l{display:flex;align-items:center;gap:11px}
.logo{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;font-size:19px;font-weight:700;
  box-shadow:0 8px 20px -8px rgba(91,91,214,.9);
}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.01em}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--text-3)}
.tools{display:flex;gap:7px}
.tools button{
  height:34px;padding:0 11px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.16s;
}
.tools button:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}

.monthbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mnav{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);font-size:16px;line-height:1;
  cursor:pointer;display:grid;place-items:center;transition:.16s;font-family:inherit;
}
.mnav:hover{border-color:var(--brand);color:var(--brand)}
.mlabel{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:.02em}
.mlabel span{display:block;font-size:11px;color:var(--text-3);font-weight:500;margin-top:2px}
.mnow{
  height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface);color:var(--text-2);font-size:12.5px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:.16s;flex:0 0 auto;
}
.mnow:hover{border-color:var(--brand);color:var(--brand)}

/* ============ Hero ============ */
.hero{
  position:relative;overflow:hidden;border-radius:26px;padding:22px 22px 20px;color:#fff;
  background:linear-gradient(135deg,#5b5bd6 0%,#7c6cf6 52%,#a78bfa 100%);
  box-shadow:0 22px 44px -22px rgba(91,91,214,.95);
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.32),transparent 68%);
  pointer-events:none;   /* 纯装饰，别挡住右上角的按钮 */
}
.hero-top{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;opacity:.9;font-weight:600;letter-spacing:.04em}
.hero-pill{
  background:rgba(255,255,255,.2);border:0;padding:5px 11px;border-radius:99px;
  font-size:11.5px;letter-spacing:0;color:#fff;font-family:inherit;font-weight:600;
  cursor:pointer;transition:background .16s;position:relative;z-index:1;
}
.hero-pill:hover{background:rgba(255,255,255,.34)}
.hero-warn{background:rgba(255,255,255,.24);padding:1px 6px;border-radius:6px;font-weight:700}
.hero-amount{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px;line-height:1.12}
.hero-amount small{font-size:19px;font-weight:700;margin-right:3px;opacity:.85}
.hero-sub{font-size:13px;opacity:.92;margin-bottom:16px}
.hero-bar{height:9px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;position:relative;z-index:1}
.hero-bar i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .6s cubic-bezier(.22,1,.36,1)}
.hero-bar.over i{background:#ffd0d8}

/* ============ 分段控件 ============ */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:15px}
.seg button{
  flex:1;border:0;background:transparent;padding:10px 6px;border-radius:12px;
  font-size:14px;font-family:inherit;color:var(--text-2);cursor:pointer;
  font-weight:600;transition:.18s;
}
.seg button.on{background:var(--seg-on);color:var(--brand);box-shadow:0 1px 4px rgba(17,20,32,.12)}
#tabs{margin:18px 0 14px}

/* ============ 预算项目 ============ */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.summary>div{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:12px 13px;box-shadow:var(--shadow)}
.summary span{display:block;font-size:11.5px;color:var(--text-3);margin-bottom:4px}
.summary b{font-size:16px;font-weight:750;letter-spacing:-.01em}

.hint{
  padding:12px 14px;border-radius:14px;background:rgba(245,158,11,.13);color:#9a6307;
  font-size:12.5px;line-height:1.55;margin-bottom:14px;cursor:pointer;font-weight:600;
}
html[data-theme="dark"] .hint{color:#fbbf24;background:rgba(245,158,11,.14)}

.item{
  display:flex;gap:13px;padding:15px;border-radius:20px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:11px;
  cursor:pointer;transition:transform .18s,border-color .18s;
}
.item:hover{transform:translateY(-2px);border-color:rgba(91,91,214,.4)}
.ico{
  width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;
  font-size:20px;background:var(--surface-2);
}
.item .body{flex:1;min-width:0}
.row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row1 b{font-size:15.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan{font-size:16px;font-weight:750;letter-spacing:-.01em;white-space:nowrap}
.plan em{font-size:11px;font-style:normal;color:var(--text-3);font-weight:500;margin-left:1px}
.row2{font-size:11.5px;color:var(--text-3);margin:4px 0 9px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .55s cubic-bezier(.22,1,.36,1)}
.bar.over i{background:linear-gradient(90deg,#f43f5e,#fb7185)}
.row3{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-top:7px}
.row3 .over-txt{color:var(--rose);font-weight:700}
.row3 .share{color:var(--brand-ink);font-weight:700}

.add-row{
  width:100%;padding:15px;border-radius:18px;border:1.5px dashed var(--line);
  background:transparent;color:var(--text-2);font-size:14.5px;font-weight:650;
  font-family:inherit;cursor:pointer;margin-top:3px;transition:.18s;
}
.add-row:hover{border-color:var(--brand);color:var(--brand);background:rgba(91,91,214,.06)}

.empty-state{
  text-align:center;padding:44px 22px;background:var(--surface);border-radius:24px;
  border:1px solid var(--line);box-shadow:var(--shadow);
}
.empty-state .e{font-size:46px;line-height:1}
.empty-state h3{margin:14px 0 7px;font-size:17px;font-weight:700}
.empty-state p{margin:0 0 20px;color:var(--text-2);font-size:13.5px;line-height:1.65}
.empty-state .btn{max-width:260px;margin:0 auto}

/* ============ 日历 ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{text-align:center;font-size:11.5px;color:var(--text-3);padding:4px 0 8px;font-weight:650}
.cell{
  aspect-ratio:1/1;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;transition:.16s;overflow:hidden;padding:2px;
}
.cell:hover{border-color:var(--brand);transform:translateY(-2px)}
.cell.blank{background:transparent;border:0;cursor:default;transform:none}
.cell .d{font-size:13px;color:var(--text-2);font-weight:600;line-height:1}
.cell.blank .d{display:none}
.cell.has{background:linear-gradient(180deg,rgba(91,91,214,.13),rgba(91,91,214,.04));border-color:rgba(91,91,214,.3)}
.cell .amt{font-size:10px;color:var(--brand);font-weight:750;letter-spacing:-.03em;max-width:100%;overflow:hidden;white-space:nowrap}
.cell.today{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,91,214,.16)}
.cell.today .d{color:var(--brand);font-weight:750}
.cal-foot{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;
}
.cal-foot>div{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:12px 13px;box-shadow:var(--shadow)}
.cal-foot span{display:block;font-size:11.5px;color:var(--text-3);margin-bottom:4px}
.cal-foot b{font-size:16px;font-weight:750}
.cal-tip{font-size:12px;color:var(--text-3);text-align:center;margin:14px 0 0;line-height:1.6}

/* ============ 流水 ============ */
.daygroup{margin-bottom:16px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px}
.dayhead b{font-size:13px;font-weight:700}
.dayhead span{font-size:12px;color:var(--text-2);font-weight:600}
.rec{
  display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;margin-bottom:8px;cursor:pointer;transition:.16s;
}
.rec:hover{border-color:rgba(91,91,214,.4);transform:translateY(-1px)}
.rec .r-ico{width:34px;height:34px;flex:0 0 auto;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);font-size:16px}
.rec .r-main{flex:1;min-width:0}
.rec .r-main b{display:block;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .r-main span{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .r-amt{font-size:15.5px;font-weight:750;letter-spacing:-.01em;white-space:nowrap}

/* ============ FAB ============ */
.fab{
  position:fixed;right:20px;bottom:calc(26px + env(safe-area-inset-bottom));z-index:40;
  width:60px;height:60px;border-radius:22px;border:0;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;
  font-size:28px;font-weight:400;line-height:1;cursor:pointer;
  box-shadow:0 14px 30px -10px rgba(91,91,214,.95);
  transition:transform .18s;
  font-family:inherit;
  display:grid;place-items:center;padding-bottom:2px;
}
.fab:hover{transform:translateY(-3px) scale(1.03)}
.fab:active{transform:scale(.94)}
@media(min-width:840px){ .fab{right:calc(50vw - 390px + 20px)} }

/* ============ 底部弹层 ============ */
.mask{
  position:fixed;inset:0;z-index:50;background:rgba(9,11,18,.46);
  opacity:0;pointer-events:none;transition:opacity .26s;
}
/* 模糊只在弹层真正打开时才做，平时不占渲染开销 */
.mask.on{opacity:1;pointer-events:auto;backdrop-filter:blur(3px)}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:51;width:min(580px,100%);
  max-height:92vh;overflow-y:auto;padding:20px 20px calc(26px + env(safe-area-inset-bottom));
  background:var(--surface);border-radius:26px 26px 0 0;
  box-shadow:0 -18px 50px -20px rgba(0,0,0,.5);
  transform:translate(-50%,110%);transition:transform .34s cubic-bezier(.22,1,.36,1);
  -webkit-overflow-scrolling:touch;
}
.sheet.on{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sheet-head h3{margin:0;font-size:18px;font-weight:750}
.sheet-head .x{
  width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--text-2);font-size:14px;cursor:pointer;font-family:inherit;display:grid;place-items:center;
}
.sheet-head .x:hover{color:var(--rose);border-color:var(--rose)}

.field{display:block;margin-bottom:15px}
.field>span{display:block;font-size:12px;color:var(--text-2);margin-bottom:8px;font-weight:650;letter-spacing:.02em}
.field input{
  width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--text);font-size:16px;font-family:inherit;
  outline:none;transition:.18s;
}
.field input::placeholder{color:var(--text-3)}
.field input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px rgba(91,91,214,.15)}

.inline{display:flex;gap:10px}
.mini{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:9px 13px;transition:.18s}
.mini.grow{flex:1.9}
.mini:focus-within{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px rgba(91,91,214,.15)}
.mini label{display:block;font-size:10.5px;color:var(--text-3);margin-bottom:2px}
.mini input{width:100%;border:0;background:transparent;font-size:18px;font-weight:700;color:var(--text);outline:none;font-family:inherit;padding:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface-2);font-size:13px;color:var(--text-2);
  cursor:pointer;font-family:inherit;transition:.16s;font-weight:600;
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{border-color:var(--brand);background:rgba(91,91,214,.13);color:var(--brand)}
.chip.emo{font-size:18px;padding:7px 10px;line-height:1;font-weight:400}

.preview{
  margin:2px 0 17px;padding:13px 15px;border-radius:14px;font-size:13.5px;line-height:1.55;
  background:rgba(16,185,129,.11);color:#0a7a58;font-weight:650;
}
html[data-theme="dark"] .preview{color:#5ee0b0;background:rgba(16,185,129,.14)}
.preview b{font-weight:800}

.btn{
  width:100%;border:0;border-radius:16px;padding:15px;font-size:15.5px;font-weight:700;
  font-family:inherit;cursor:pointer;transition:.16s;
}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 12px 26px -12px rgba(91,91,214,.95)}
.btn.danger{background:rgba(244,63,94,.11);color:var(--rose);margin-top:10px}
.btn.danger:hover{background:rgba(244,63,94,.18)}
.amt-in{display:flex;align-items:center;gap:9px;padding:11px 15px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);transition:.18s}
.amt-in:focus-within{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px rgba(91,91,214,.15)}
.amt-in i{font-style:normal;color:var(--text-3);font-size:19px;font-weight:700}
.amt-in input{flex:1;border:0;background:transparent;font-size:27px;font-weight:800;color:var(--text);outline:none;font-family:inherit;padding:0;width:100%;letter-spacing:-.02em}
.sheet-note{font-size:12px;color:var(--text-3);line-height:1.6;margin:-4px 0 15px}

/* ============ toast ============ */
.toast{
  position:fixed;left:50%;bottom:104px;z-index:60;transform:translate(-50%,16px);
  background:rgba(17,20,32,.94);color:#fff;padding:11px 20px;border-radius:14px;
  font-size:13.5px;font-weight:650;opacity:0;pointer-events:none;transition:.28s;
  backdrop-filter:blur(6px);white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 手机端 ============ */
@media(max-width:430px){
  .app{padding:18px 14px 118px}
  .brand-l{gap:9px}
  .logo{width:36px;height:36px;border-radius:12px;font-size:17px}
  .brand h1{font-size:16px}
  .brand p{font-size:11px}
  .tools{gap:6px}
  .tools button{height:32px;padding:0 10px;font-size:12px}
  .tools .t-txt{display:none}
  .tools button .t-ico{font-size:15px}

  .monthbar{gap:8px}
  .mlabel{font-size:14px}
  .mnav{width:32px;height:32px}
  .mnow{height:32px;padding:0 10px;font-size:12px}

  .hero{border-radius:22px;padding:18px 18px 17px}
  .hero-amount{font-size:33px}
  .hero-sub{font-size:12.5px;margin-bottom:14px}

  .seg button{font-size:13px;padding:9px 4px}
  #tabs{margin:14px 0 12px}

  .summary,.cal-foot{gap:8px}
  .summary>div,.cal-foot>div{padding:10px;border-radius:15px}
  .summary span,.cal-foot span{font-size:10.5px}
  .summary b,.cal-foot b{font-size:14px;white-space:nowrap}

  .item{padding:13px;gap:11px;border-radius:18px}
  .ico{width:40px;height:40px;border-radius:13px;font-size:18px}
  .row1 b{font-size:15px}
  .plan{font-size:15px}
  .row2{font-size:11px}

  .cal{gap:5px}
  .cal .hd{font-size:11px}
  .cell{border-radius:12px}
  .cell .d{font-size:12px}
  .cell .amt{font-size:9.5px}

  .sheet{padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
  .sheet-head h3{font-size:17px}
  .chip{padding:9px 12px;font-size:12.5px}
  .chip.emo{font-size:17px;padding:7px 9px}
  .preview{font-size:13px;padding:12px 14px}
  .toast{bottom:calc(100px + env(safe-area-inset-bottom))}
}
@media(max-width:360px){
  .summary b,.cal-foot b{font-size:12.5px}
  .summary span,.cal-foot span{font-size:10px}
  .summary>div,.cal-foot>div{padding:9px 8px}
}
</style>
</head>
<body>

<div class="app">
  <div id="top"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" title="记一笔支出" aria-label="记一笔支出">＋</button>
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
/* =========================================================
   预算本 —— 先写下每天的预算，自动推算本月要花多少
   数据全部保存在本机浏览器（localStorage），可导出备份
   ========================================================= */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const KEY = 'budgetbook.v1';
const EMOJIS = ['🥛','🍚','🍜','☕','🛒','🚌','🚇','🚗','🏠','💡','📱','🌐','💊','🏥','👕','💄','🎬','🎮','📚','🎁','🐱','🚬','🍺','✈️','🏋️','🧾'];
const CYCLES = ['day','week','month'];
const CYCLE_LABEL = { day:'每天', week:'每周', month:'每月' };

/* ---------- 工具 ---------- */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const money = n => round2(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
// 日历格子很窄，用缩写：1285.71 → 1,286；12857 → 1.3万
function moneyCell(n){
  const v = Math.round(n || 0);
  if(v >= 10000) return (v / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return v.toLocaleString('zh-CN');
}

function currentYM(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function daysInMonth(ym){ const p = ym.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); }
function shiftMonth(ym, k){ const p = ym.split('-').map(Number); const d = new Date(p[0], p[1] - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthLabel(ym){ const p = ym.split('-').map(Number); return p[0] + ' 年 ' + p[1] + ' 月'; }
function weekdayCN(ds){ const p = ds.split('-').map(Number); return ['周日','周一','周二','周三','周四','周五','周六'][new Date(p[0], p[1] - 1, p[2]).getDay()]; }
function dayLabel(ds){
  const today = todayStr();
  if (ds === today) return '今天';
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yStr = y.getFullYear() + '-' + pad(y.getMonth() + 1) + '-' + pad(y.getDate());
  if (ds === yStr) return '昨天';
  const p = ds.split('-').map(Number);
  return p[1] + ' 月 ' + p[2] + ' 日 ' + weekdayCN(ds);
}

/* ---------- 状态 ---------- */
// 每个月一份独立的预算：{ 'YYYY-MM': { allowance: 数字或 null, items: [...] } }
// 新月份会自动从上一个月复制一份，之后各改各的、互不影响
let state = { v: 2, months: {}, records: [], theme: 'auto' };
const ui = { tab: 'budget', month: currentYM() };

function loadState(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    state.records = Array.isArray(d.records) ? d.records : [];
    state.theme = d.theme || 'auto';
    if(d.months && typeof d.months === 'object'){
      // v2：每个月独立
      state.months = {};
      for(const k of Object.keys(d.months)){
        const m = d.months[k] || {};
        state.months[k] = { allowance: (typeof m.allowance === 'number' ? m.allowance : null), items: Array.isArray(m.items) ? m.items : [] };
      }
    }else if(Array.isArray(d.items)){
      // 从 v1 升级：原来只有一套预算，放进当前月
      state.months = {};
      if(d.items.length) state.months[currentYM()] = { allowance: null, items: d.items };
    }
  }catch(e){ /* 存储不可用时静默降级为内存模式 */ }
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('无法写入本地存储，数据只在当前页面有效'); }
}

/* ---------- 每个月一份预算 ---------- */
const cloneItem = it => ({ id: it.id, name: it.name, emoji: it.emoji, cycle: it.cycle, times: it.times, amount: it.amount, createdAt: it.createdAt });

// 读某个月的预算。这一月还没建过，就就近继承更早的一个月（只在内存里算，不落库）
function monthData(ym){
  const own = state.months[ym];
  if(own) return own;
  const prev = Object.keys(state.months).filter(k => k < ym).sort().pop();
  const src = prev ? state.months[prev] : null;
  return { allowance: src ? src.allowance : null, items: src ? src.items.map(cloneItem) : [] };
}
// 要改这个月了，先把它固化下来，之后的改动只影响这个月
function ensureMonth(ym){
  if(!state.months[ym]){
    const d = monthData(ym);
    state.months[ym] = { allowance: d.allowance, items: d.items };
  }
  return state.months[ym];
}
function monthItems(ym){ return monthData(ym).items; }
// 跨月份找项目：某条记录可能属于别的月份建的项目
function findItem(id){
  if(!id) return null;
  const cur = monthItems(ui.month).find(x => x.id === id);
  if(cur) return cur;
  for(const k of Object.keys(state.months)){
    const hit = state.months[k].items.find(x => x.id === id);
    if(hit) return hit;
  }
  return null;
}
function monthCount(){ return Object.keys(state.months).length; }

/* ---------- 核心计算：一个月要花多少 ---------- */
// 一个月里有几个「周期」：每天→当月天数；每周→天数/7；每月→1
function periodsIn(ym, cycle){
  const d = daysInMonth(ym);
  if(cycle === 'day') return d;
  if(cycle === 'week') return d / 7;
  return 1;
}
// 某个预算项目的「本月预计」
function itemPlan(it, ym){
  return round2((Number(it.amount) || 0) * (Number(it.times) || 1) * periodsIn(ym, it.cycle));
}
function itemSpent(it, ym){
  return round2(state.records.reduce((s, r) => (r.itemId === it.id && r.date.slice(0,7) === ym) ? s + r.amount : s, 0));
}
function monthRecords(ym){ return state.records.filter(r => r.date.slice(0,7) === ym); }
function monthPlan(ym){ return round2(monthItems(ym).reduce((s, it) => s + itemPlan(it, ym), 0)); }
function monthSpent(ym){ return round2(monthRecords(ym).reduce((s, r) => s + r.amount, 0)); }
function daySpent(ds){ return round2(state.records.reduce((s, r) => r.date === ds ? s + r.amount : s, 0)); }
function daysLeft(ym){
  const t = todayStr().slice(0,7);
  if(ym < t) return 0;
  if(ym > t) return daysInMonth(ym);
  return daysInMonth(ym) - new Date().getDate() + 1;
}
function cycleDesc(it){
  const t = Number(it.times) || 1;
  const a = '¥' + money(it.amount);
  return CYCLE_LABEL[it.cycle] + ' ' + (t > 1 ? t + ' 次 × ' + a : a);
}
function previewText(cycle, times, amount, ym){
  const days = daysInMonth(ym);
  const t = Math.max(1, Number(times) || 1);
  const a = Number(amount) || 0;
  const total = round2(a * t * periodsIn(ym, cycle));
  const per = t > 1 ? t + ' 次 × ¥' + money(a) : '¥' + money(a);
  const head = CYCLE_LABEL[cycle] + ' ' + per;
  let formula;
  if(cycle === 'day') formula = '本月 ' + days + ' 天';
  else if(cycle === 'week') formula = '本月约 ' + round2(days / 7) + ' 周';
  else formula = '按月固定';
  return head + ' → ' + formula + '，预计 <b>¥' + money(total) + '</b>';
}

/* ---------- 主题 ---------- */
function applyTheme(){
  const t = state.theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if((state.theme || 'auto') === 'auto') applyTheme(); });

/* ---------- 渲染：顶部 ---------- */
function renderTop(){
  const ym = ui.month;
  const days = daysInMonth(ym);
  const items = monthItems(ym);
  const plan = round2(items.reduce((s, it) => s + itemPlan(it, ym), 0));
  const allowance = monthData(ym).allowance;
  const hasAllow = typeof allowance === 'number' && allowance > 0;
  const base = hasAllow ? allowance : plan;                    // 总额：填了就用填的，没填就用各项之和
  const spent = monthSpent(ym);
  const left = round2(base - spent);
  const free = hasAllow ? round2(allowance - plan) : 0;        // 还没安排用途的部分
  const over = left < -0.004;
  const dl = daysLeft(ym);
  const dark = document.documentElement.dataset.theme === 'dark';

  // 进度条：填了总额 → 已规划占总额；没填 → 已花占总额
  const barPct = base > 0 ? Math.min(100, (hasAllow ? plan : spent) / base * 100) : 0;

  let sub;
  if(hasAllow){
    sub = '已规划 ¥' + money(plan) + ' · ' +
      (free >= 0 ? '可支配 ¥' + money(free) : '<span class="hero-warn">超出 ¥' + money(-free) + '</span>');
  }else{
    sub = items.length ? ('由 ' + items.length + ' 个项目组成 · 已花 ¥' + money(spent)) : '还没有预算项目';
  }

  const pill = '<button class="hero-pill" data-act="allow">' +
    (hasAllow ? '可用 ¥' + money(allowance) + ' ✎' : '＋ 设置本月可用') + '</button>';

  $('#top').innerHTML =
  '<div class="brand">' +
    '<div class="brand-l">' +
      '<div class="logo">¥</div>' +
      '<div><h1>预算本</h1><p>先定预算，再记每天</p></div>' +
    '</div>' +
    '<div class="tools">' +
      '<button data-act="theme" title="切换深浅色"><span class="t-ico">' + (dark ? '☀' : '☾') + '</span><span class="t-txt">' + (dark ? ' 浅色' : ' 深色') + '</span></button>' +
      '<button data-act="export" title="导出备份">导出</button>' +
      '<button data-act="import" title="导入备份">导入</button>' +
    '</div>' +
  '</div>' +

  '<div class="monthbar">' +
    '<button class="mnav" data-act="prev" aria-label="上个月">‹</button>' +
    '<div class="mlabel">' + monthLabel(ym) + '<span>' + days + ' 天 · 已过 ' + (days - dl) + ' 天</span></div>' +
    '<button class="mnav" data-act="next" aria-label="下个月">›</button>' +
    (ym === currentYM() ? '' : '<button class="mnow" data-act="cur">回到本月</button>') +
  '</div>' +

  '<div class="hero">' +
    '<div class="hero-top"><span>' + (hasAllow ? '本月可用' : '本月预算') + '</span>' + pill + '</div>' +
    '<div class="hero-amount"><small>¥</small>' + money(base) + '</div>' +
    '<div class="hero-sub">' + sub + '</div>' +
    '<div class="hero-bar' + (over ? ' over' : '') + '"><i style="width:' + barPct + '%"></i></div>' +
  '</div>' +

  '<div class="seg" id="tabs">' +
    ['budget:预算项目','calendar:日历','ledger:流水'].map(function(x){
      const v = x.split(':');
      return '<button data-act="tab" data-tab="' + v[0] + '"' + (ui.tab === v[0] ? ' class="on"' : '') + '>' + v[1] + '</button>';
    }).join('') +
  '</div>';
}

/* ---------- 渲染：预算项目 ---------- */
function viewBudget(){
  const ym = ui.month;
  const items = monthItems(ym);

  if(!items.length){
    return '<div class="empty-state">' +
      '<div class="e">🥛</div>' +
      '<h3>' + monthLabel(ym) + '还没有预算</h3>' +
      '<p>比如「每天的牛奶 2 元」，<br>它会自动算出这个月需要 60 元。</p>' +
      '<button class="btn primary" data-act="item-new">＋ 添加预算项目</button>' +
    '</div>';
  }

  const rows = items.map(function(it){
    const plan = itemPlan(it, ym);
    const spent = itemSpent(it, ym);
    const pct = plan > 0 ? Math.min(100, spent / plan * 100) : (spent > 0 ? 100 : 0);
    return { it: it, plan: plan, spent: spent, pct: pct, over: plan > 0 && spent > plan + 0.004, daily: plan / daysInMonth(ym) };
  });

  const totalPlan = round2(rows.reduce((s, r) => s + r.plan, 0));
  const totalSpent = round2(rows.reduce((s, r) => s + r.spent, 0));
  const orphan = round2(monthRecords(ym).reduce((s, r) => s + (findItem(r.itemId) ? 0 : r.amount), 0));

  let html = '';

  html += '<div class="summary">' +
    '<div><span>预算项目</span><b>' + items.length + ' 个</b></div>' +
    '<div><span>已规划</span><b>¥' + money(totalPlan) + '</b></div>' +
    '<div><span>已花</span><b>¥' + money(totalSpent) + '</b></div>' +
  '</div>';

  if(orphan > 0){
    html += '<div class="hint" data-act="tab" data-tab="ledger">有 ¥' + money(orphan) + ' 没归到任何预算项目，点这里去整理 →</div>';
  }

  html += rows.map(function(r){
    const it = r.it;
    const share = totalPlan > 0 ? Math.round(r.plan / totalPlan * 100) : 0;
    const right = r.over
      ? '<span class="over-txt">已花 ¥' + money(r.spent) + ' · 超 ¥' + money(r.spent - r.plan) + '</span>'
      : '<span>已花 ¥' + money(r.spent) + '</span>';
    return '<div class="item" data-act="item-edit" data-id="' + it.id + '">' +
      '<div class="ico">' + esc(it.emoji || '🧾') + '</div>' +
      '<div class="body">' +
        '<div class="row1"><b>' + esc(it.name) + '</b><span class="plan">¥' + money(r.plan) + '<em>/月</em></span></div>' +
        '<div class="row2">' + cycleDesc(it) + ' · 日均 ¥' + money(r.daily) + '</div>' +
        '<div class="bar' + (r.over ? ' over' : '') + '"><i style="width:' + r.pct + '%"></i></div>' +
        '<div class="row3"><span class="share">占本月预算 ' + share + '%</span>' + right + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  html += '<button class="add-row" data-act="item-new">＋ 添加预算项目</button>';
  return html;
}

/* ---------- 渲染：日历 ---------- */
function viewCalendar(){
  const ym = ui.month;
  const days = daysInMonth(ym);
  const p = ym.split('-').map(Number);
  const offset = (new Date(p[0], p[1] - 1, 1).getDay() + 6) % 7; // 周一开头
  const today = todayStr();

  const daily = {};
  monthRecords(ym).forEach(function(r){ daily[r.date] = (daily[r.date] || 0) + r.amount; });

  let cells = ['一','二','三','四','五','六','日'].map(w => '<div class="hd">' + w + '</div>').join('');
  for(let i = 0; i < offset; i++) cells += '<div class="cell blank"><span class="d"></span></div>';
  for(let d = 1; d <= days; d++){
    const ds = ym + '-' + pad(d);
    const amt = daily[ds] || 0;
    cells += '<div class="cell' + (amt > 0 ? ' has' : '') + (ds === today ? ' today' : '') + '" data-act="day" data-date="' + ds + '">' +
      '<span class="d">' + d + '</span>' +
      (amt > 0 ? '<span class="amt">¥' + moneyCell(amt) + '</span>' : '') +
    '</div>';
  }

  const recs = monthRecords(ym);
  const spent = round2(recs.reduce((s, r) => s + r.amount, 0));
  const activeDays = Object.keys(daily).length;
  const firstDay = Object.keys(daily).sort()[0];

  return '<div class="cal">' + cells + '</div>' +
    '<div class="cal-foot">' +
      '<div><span>本月合计</span><b>¥' + money(spent) + '</b></div>' +
      '<div><span>有记录天数</span><b>' + activeDays + ' 天</b></div>' +
      '<div><span>记账日均</span><b>¥' + money(activeDays ? spent / activeDays : 0) + '</b></div>' +
    '</div>' +
    '<p class="cal-tip">' + (firstDay ? '点任意一天可以补记或修改那天的支出' : '本月还没有任何记录，点右下角的 ＋ 记第一笔') + '</p>';
}

/* ---------- 渲染：流水 ---------- */
function viewLedger(){
  const ym = ui.month;
  const recs = monthRecords(ym).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0));

  if(!recs.length){
    return '<div class="empty-state">' +
      '<div class="e">🧾</div>' +
      '<h3>这个月还没有流水</h3>' +
      '<p>每一笔支出记下来，<br>就能看到每个预算项目实际花了多少。</p>' +
      '<button class="btn primary" data-act="record-new">＋ 记一笔</button>' +
    '</div>';
  }

  const groups = [];
  recs.forEach(function(r){
    let g = groups[groups.length - 1];
    if(!g || g.date !== r.date){ g = { date: r.date, list: [] }; groups.push(g); }
    g.list.push(r);
  });

  return groups.map(function(g){
    const sum = round2(g.list.reduce((s, r) => s + r.amount, 0));
    return '<div class="daygroup">' +
      '<div class="dayhead"><b>' + dayLabel(g.date) + '</b><span>¥' + money(sum) + '</span></div>' +
      g.list.map(function(r){
        const it = findItem(r.itemId);
        const title = it ? it.name : '未归类';
        const ico = it ? (it.emoji || '🧾') : '❔';
        const sub = r.note ? esc(r.note) : (it ? cycleDesc(it) : '没有归到预算项目');
        return '<div class="rec" data-act="edit-record" data-id="' + r.id + '">' +
          '<div class="r-ico">' + esc(ico) + '</div>' +
          '<div class="r-main"><b>' + esc(title) + '</b><span>' + sub + '</span></div>' +
          '<div class="r-amt">-¥' + money(r.amount) + '</div>' +
        '</div>';
      }).join('') +
    '</div>';
  }).join('') + '<button class="add-row" data-act="record-new">＋ 再记一笔</button>';
}

/* ---------- 主渲染 ---------- */
function render(){
  renderTop();
  const v = $('#view');
  if(ui.tab === 'budget') v.innerHTML = viewBudget();
  else if(ui.tab === 'calendar') v.innerHTML = viewCalendar();
  else v.innerHTML = viewLedger();
}

/* ---------- 弹层 ---------- */
let sheetMode = null;

function openSheet(html, mode){
  const s = $('#sheet');
  s.innerHTML = html;
  sheetMode = mode || null;
  $('#mask').classList.add('on');
  requestAnimationFrame(function(){ s.classList.add('on'); });
  const focus = s.querySelector('input');
  if(focus && window.innerWidth > 700) setTimeout(function(){ focus.focus(); }, 340);
}
function closeSheet(){
  $('#sheet').classList.remove('on');
  $('#mask').classList.remove('on');
  sheetMode = null;
}

/* ---------- 表单：新增 / 编辑预算项目 ---------- */
function openItemSheet(it){
  const editing = !!it;
  const d = it || { id: '', name: '', emoji: '🥛', cycle: 'day', times: 1, amount: '' };

  const emojiChips = EMOJIS.map(function(e){
    return '<button class="chip emo' + (d.emoji === e ? ' on' : '') + '" data-act="pick-emoji" data-v="' + e + '">' + e + '</button>';
  }).join('');

  const cycleBtns = CYCLES.map(function(c){
    return '<button data-act="pick-cycle" data-v="' + c + '"' + (d.cycle === c ? ' class="on"' : '') + '>' + CYCLE_LABEL[c] + '</button>';
  }).join('');

  openSheet(
    '<div class="sheet-head"><h3>' + (editing ? '编辑预算项目' : '添加预算项目') + '</h3><button class="x" data-act="close">✕</button></div>' +
    '<p class="sheet-note">只改 <b>' + monthLabel(ui.month) + '</b> 的预算，其他月份不受影响。</p>' +
    '<label class="field"><span>名称</span><input id="f-name" placeholder="比如：牛奶、房租、超市采购" value="' + esc(d.name) + '" maxlength="20"></label>' +
    '<div class="field"><span>图标</span><div class="chips" id="f-emoji">' + emojiChips + '</div></div>' +
    '<div class="field"><span>多久花一次</span><div class="seg" id="f-cycle">' + cycleBtns + '</div></div>' +
    '<div class="field"><span>频次与金额</span><div class="inline">' +
      '<div class="mini"><label>次数</label><input id="f-times" type="number" min="1" step="1" inputmode="numeric" value="' + (d.times || 1) + '"></div>' +
      '<div class="mini grow"><label>每次金额（元）</label><input id="f-amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="' + (d.amount === '' ? '' : d.amount) + '"></div>' +
    '</div></div>' +
    '<div class="preview" id="preview"></div>' +
    '<button class="btn primary" data-act="save-item" data-id="' + (editing ? it.id : '') + '">' + (editing ? '保存修改' : '添加') + '</button>' +
    (editing ? '<button class="btn danger" data-act="del-item" data-id="' + it.id + '">删除这个预算项目</button>' : ''),
    'item'
  );

  const s = $('#sheet');
  s.dataset.emoji = d.emoji;
  s.dataset.cycle = d.cycle;
  s.dataset.itemId = editing ? it.id : '';

  refreshItemPreview();
}

function collectItemForm(){
  const s = $('#sheet');
  return {
    name: ($('#f-name') ? $('#f-name').value : '').trim(),
    emoji: s.dataset.emoji || '🧾',
    cycle: CYCLES.indexOf(s.dataset.cycle) >= 0 ? s.dataset.cycle : 'day',
    times: Math.max(1, parseInt($('#f-times').value, 10) || 1),
    amount: Number($('#f-amount').value) || 0
  };
}
function refreshItemPreview(){
  const el = $('#preview');
  if(!el) return;
  const f = collectItemForm();
  el.innerHTML = previewText(f.cycle, f.times, f.amount, ui.month);
}
function saveItem(id){
  const f = collectItemForm();
  if(!f.name){ toast('给这个预算项目起个名字'); if($('#f-name')) $('#f-name').focus(); return; }
  if(f.amount <= 0){ toast('填一下每次的金额'); if($('#f-amount')) $('#f-amount').focus(); return; }

  const m = ensureMonth(ui.month);
  if(id){
    const it = m.items.find(x => x.id === id);
    if(it) Object.assign(it, f);
  }else{
    m.items.push({ id: uid(), name: f.name, emoji: f.emoji, cycle: f.cycle, times: f.times, amount: f.amount, createdAt: Date.now() });
  }
  saveState(); closeSheet(); render();
  toast(id ? '已保存（只改了 ' + monthLabel(ui.month) + '）'
           : '已添加，本月预计 ¥' + money(f.amount * f.times * periodsIn(ui.month, f.cycle)));
}
function deleteItem(id){
  const m = ensureMonth(ui.month);
  const it = m.items.find(x => x.id === id);
  if(!it) return;
  if(!confirm('从 ' + monthLabel(ui.month) + ' 删除「' + it.name + '」？\n\n其他月份的预算不受影响；已经记的账也不会删，只是会显示成「未归类」。')) return;
  m.items = m.items.filter(x => x.id !== id);
  saveState(); closeSheet(); render(); toast('已从本月删除');
}

/* ---------- 表单：本月可用金额 ---------- */
function openAllowSheet(){
  const cur = monthData(ui.month).allowance;
  const plan = monthPlan(ui.month);
  openSheet(
    '<div class="sheet-head"><h3>本月可用金额</h3><button class="x" data-act="close">✕</button></div>' +
    '<p class="sheet-note">' + monthLabel(ui.month) + ' 一共可以花多少（比如这个月的生活费）。<br>' +
      '填了之后就能看到各项预算占了多少、还剩多少可支配。</p>' +
    '<div class="field"><span>金额（元）</span><div class="amt-in"><i>¥</i><input id="f-allow" type="number" min="0" step="0.01" inputmode="decimal" placeholder="比如 8000" value="' + (cur == null ? '' : cur) + '"></div></div>' +
    '<div class="preview" id="allow-preview"></div>' +
    '<button class="btn primary" data-act="save-allow">保存</button>' +
    (cur != null ? '<button class="btn danger" data-act="clear-allow">不用总额度，只按项目合计</button>' : ''),
    'allow'
  );
  refreshAllowPreview();
}
function refreshAllowPreview(){
  const el = $('#allow-preview');
  if(!el) return;
  const v = Number(($('#f-allow') || {}).value) || 0;
  const plan = monthPlan(ui.month);
  if(v <= 0){ el.innerHTML = '本月各项预算合计 <b>¥' + money(plan) + '</b>'; return; }
  const free = round2(v - plan);
  el.innerHTML = '各项预算合计 ¥' + money(plan) + ' → 已占用 <b>' +
    Math.round(plan / v * 100) + '%</b>，' +
    (free >= 0 ? '还剩 <b>¥' + money(free) + '</b> 可支配' : '已经超出 <b>¥' + money(-free) + '</b>');
}
function saveAllow(){
  const v = round2(Number($('#f-allow').value) || 0);
  if(!(v > 0)){ toast('填一个大于 0 的金额'); $('#f-allow').focus(); return; }
  ensureMonth(ui.month).allowance = v;
  saveState(); closeSheet(); render(); toast('已设置：本月可用 ¥' + money(v));
}
function clearAllow(){
  ensureMonth(ui.month).allowance = null;
  saveState(); closeSheet(); render(); toast('已改为按项目合计');
}

/* ---------- 表单：记一笔 ---------- */
function openRecordSheet(rec, presetDate){
  const editing = !!rec;
  const date = rec ? rec.date : (presetDate || todayStr());
  const itemId = rec ? (rec.itemId || '') : '';
  const amount = rec ? rec.amount : '';
  const note = rec ? (rec.note || '') : '';

  const chips = '<button class="chip' + (!itemId ? ' on' : '') + '" data-act="pick-item" data-id="">不归类</button>' +
    monthItems(ui.month).map(function(it){
      return '<button class="chip' + (itemId === it.id ? ' on' : '') + '" data-act="pick-item" data-id="' + it.id + '">' +
        esc(it.emoji || '🧾') + ' ' + esc(it.name) + '</button>';
    }).join('');

  const sameDay = state.records.filter(r => r.date === date && (!rec || r.id !== rec.id));
  const sameSum = round2(sameDay.reduce((s, r) => s + r.amount, 0));

  openSheet(
    '<div class="sheet-head"><h3>' + (editing ? '修改这一笔' : '记一笔支出') + '</h3><button class="x" data-act="close">✕</button></div>' +
    (sameDay.length ? '<p class="sheet-note">这一天已经记了 ' + sameDay.length + ' 笔，共 ¥' + money(sameSum) + '</p>' : '') +
    '<label class="field"><span>日期</span><input id="f-date" type="date" value="' + date + '"></label>' +
    '<div class="field"><span>金额（元）</span><div class="amt-in"><i>¥</i><input id="f-amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" value="' + (amount === '' ? '' : amount) + '"></div></div>' +
    '<div class="field"><span>算在哪个预算项目里</span><div class="chips" id="f-items">' + chips + '</div></div>' +
    '<label class="field"><span>备注</span><input id="f-note" placeholder="选填，比如：买了两盒牛奶" value="' + esc(note) + '" maxlength="40"></label>' +
    '<button class="btn primary" data-act="save-record" data-id="' + (editing ? rec.id : '') + '">' + (editing ? '保存修改' : '保存') + '</button>' +
    (editing ? '<button class="btn danger" data-act="del-record" data-id="' + rec.id + '">删除这条记录</button>' : ''),
    'record'
  );
  $('#sheet').dataset.itemId = itemId;
}
function pickItem(id){
  $('#sheet').dataset.itemId = id;
  $$('#f-items .chip').forEach(function(c){ c.classList.toggle('on', c.dataset.id === id); });
  const it = findItem(id);
  const inp = $('#f-amount');
  if(it && inp && !inp.dataset.touched && !Number(inp.value)) inp.value = it.amount || '';
}
function saveRecord(id){
  const date = $('#f-date').value || todayStr();
  const amount = round2(Number($('#f-amount').value));
  if(!(amount > 0)){ toast('请输入金额'); $('#f-amount').focus(); return; }
  const itemId = $('#sheet').dataset.itemId || '';
  const note = ($('#f-note').value || '').trim();

  if(id){
    const r = state.records.find(x => x.id === id);
    if(r) Object.assign(r, { date: date, amount: amount, itemId: itemId, note: note });
  }else{
    state.records.push({ id: uid(), date: date, amount: amount, itemId: itemId, note: note, createdAt: Date.now() });
  }
  saveState(); closeSheet(); render(); toast(id ? '已保存' : '记好了 ✓');
}
function deleteRecord(id){
  if(!confirm('删除这条记录？')) return;
  state.records = state.records.filter(r => r.id !== id);
  saveState(); closeSheet(); render(); toast('已删除');
}

/* ---------- 导入 / 导出 ---------- */
function exportJSON(){
  const payload = { app: 'budgetbook', version: 2, exportedAt: new Date().toISOString(), months: state.months, records: state.records };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '预算本-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast('已导出备份文件');
}
function importJSON(file){
  const fr = new FileReader();
  fr.onload = function(){
    try{
      const d = JSON.parse(fr.result);
      if(!d || !Array.isArray(d.records)) throw new Error('格式不对');
      let months;
      if(d.months && typeof d.months === 'object'){
        months = d.months;
      }else if(Array.isArray(d.items)){
        months = {};                                   // 兼容老版本备份
        months[currentYM()] = { allowance: null, items: d.items };
      }else{
        throw new Error('格式不对');
      }
      if(!confirm('导入会覆盖当前全部数据（' + monthCount() + ' 个月的预算、' + state.records.length + ' 条记录），继续？')) return;

      const next = {};
      for(const k of Object.keys(months)){
        const m = months[k] || {};
        next[k] = {
          allowance: typeof m.allowance === 'number' ? m.allowance : null,
          items: Array.isArray(m.items) ? m.items : []
        };
      }
      state.months = next;
      state.records = d.records;
      saveState(); render(); toast('导入成功：' + Object.keys(next).length + ' 个月的预算');
    }catch(e){ toast('这个文件读不出来，请选择本应用导出的 JSON'); }
  };
  fr.readAsText(file);
}

/* ---------- 清掉早期版本内置的示例数据 ---------- */
const SAMPLE_SIG = '牛奶|day|1|2,午餐|day|1|18,地铁通勤|day|2|3,超市采购|week|2|150,房租|month|1|1800';
function dropBuiltInSample(){
  let hit = false;
  for(const k of Object.keys(state.months)){
    const items = state.months[k].items;
    if(items.length !== 5) continue;
    const sig = items.map(it => it.name + '|' + it.cycle + '|' + (Number(it.times) || 1) + '|' + it.amount).join(',');
    if(sig !== SAMPLE_SIG) continue;                 // 只要动过任何一项，就当成用户自己的数据，不动它
    state.months[k].items = [];
    hit = true;
  }
  if(hit) saveState();
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1900);
}

/* ---------- 事件 ---------- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id || '';

  switch(act){
    case 'tab':          ui.tab = el.dataset.tab; render(); break;
    case 'prev':         ui.month = shiftMonth(ui.month, -1); render(); break;
    case 'next':         ui.month = shiftMonth(ui.month, 1); render(); break;
    case 'cur':          ui.month = currentYM(); render(); break;
    case 'theme':
      state.theme = (document.documentElement.dataset.theme === 'dark') ? 'light' : 'dark';
      saveState(); applyTheme(); renderTop(); break;
    case 'export':       exportJSON(); break;
    case 'import':       $('#file').click(); break;

    case 'item-new':     openItemSheet(null); break;
    case 'item-edit':    { const it = monthItems(ui.month).find(x => x.id === id); if(it) openItemSheet(it); break; }
    case 'pick-emoji':
      $('#sheet').dataset.emoji = el.dataset.v;
      $$('#f-emoji .chip').forEach(function(c){ c.classList.toggle('on', c.dataset.v === el.dataset.v); });
      break;
    case 'pick-cycle':
      $('#sheet').dataset.cycle = el.dataset.v;
      $$('#f-cycle button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === el.dataset.v); });
      refreshItemPreview();
      break;
    case 'save-item':    saveItem(id); break;
    case 'del-item':     deleteItem(id); break;

    case 'record-new':   openRecordSheet(null); break;
    case 'day':          openRecordSheet(null, el.dataset.date); break;
    case 'edit-record':  { const r = state.records.find(x => x.id === id); if(r) openRecordSheet(r); break; }
    case 'pick-item':    pickItem(id); break;
    case 'save-record':  saveRecord(id); break;
    case 'del-record':   deleteRecord(id); break;

    case 'close':        closeSheet(); break;

    case 'allow':        openAllowSheet(); break;
    case 'save-allow':   saveAllow(); break;
    case 'clear-allow':  clearAllow(); break;
  }
});

document.addEventListener('input', function(e){
  if(e.target.id === 'f-amount' && sheetMode === 'item') refreshItemPreview();
  if(e.target.id === 'f-times' && sheetMode === 'item') refreshItemPreview();
  if(e.target.id === 'f-allow' && sheetMode === 'allow') refreshAllowPreview();
  if(e.target.id === 'f-amount' && sheetMode === 'record') e.target.dataset.touched = '1';
});

$('#mask').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSheet(); });
$('#fab').addEventListener('click', function(){ openRecordSheet(null); });
$('#file').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(f) importJSON(f);
  e.target.value = '';
});

/* ---------- 启动 ---------- */
loadState();
dropBuiltInSample();
ui.month = currentYM();
applyTheme();
render();

/* ---------- 离线缓存（浏览器里用；APK 内资源本来就打包在本地，不需要） ---------- */
const IN_APP = location.hostname === 'appassets.androidplatform.net';
if(!IN_APP && 'serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){ /* 注册失败不影响使用 */ });
  });
}
</script>
